  <script>
    window.__smIntroBornAt=Date.now();
    window.RESTBR_HOURS_READY=false;
    document.documentElement.classList.add("sm-hours-pending");

    document.addEventListener("click",function(event){
      if(window.RESTBR_HOURS_READY===true)return;
      const target=event.target.closest?.(
        ".sm-add-cart,.sm-direct-add,.sm-choose-options,[data-choice-product],#smCartContinue,#smSendWhatsApp"
      );
      if(!target)return;
      event.preventDefault();
      event.stopImmediatePropagation();
    },true);

    try{
      const templateResetKey="RESTBR_TEMPLATE_RESET_V2";
      if(localStorage.getItem(templateResetKey)!=="done"){
        [
          "RESTBR_BRAND_CACHE_V1",
          "RESTBR_MENU_OFFLINE_CACHE_V1",
          "RESTBR_CART_V1"
        ].forEach(key=>localStorage.removeItem(key));
        sessionStorage.removeItem("RESTBR_INTRO_SEEN_V1");
        localStorage.setItem(templateResetKey,"done");
      }
      localStorage.removeItem("SM_THEME_PREF_V1");
      document.documentElement.removeAttribute("data-sm-theme");
    }catch(_){}
  </script>

  <link id="smWebManifest" rel="manifest" href="manifest.webmanifest">

  <script>
    (function(){
      const fallbackName="پاشا بيبي";
      let lastIcon="";
      let manifestObjectUrl="";

      const safeLogo=value=>{
        try{
          return typeof window.RESTBR_SAFE_MEDIA_URL==="function"
            ? window.RESTBR_SAFE_MEDIA_URL(value)
            : "";
        }catch(_){
          return "";
        }
      };

      const applyAppIcon=value=>{
        const icon=safeLogo(value);
        if(!icon||icon===lastIcon)return false;
        lastIcon=icon;

        const favicon=document.getElementById("smFavicon");
        const appleIcon=document.getElementById("smAppleTouchIcon");
        const manifestLink=document.getElementById("smWebManifest");

        if(favicon)favicon.href=icon;
        if(appleIcon)appleIcon.href=icon;

        try{
          if(manifestLink&&typeof Blob!=="undefined"&&URL?.createObjectURL){
            const appRoot=new URL("./",window.location.href).href;
            const manifest={
              name:fallbackName,
              short_name:fallbackName,
              description:"متجر پاشا بيبي لمستلزمات الأطفال",
              start_url:appRoot,
              scope:appRoot,
              display:"standalone",
              background_color:"#fffaf5",
              theme_color:"#fffaf5",
              orientation:"portrait",
              icons:[
                {src:icon,sizes:"any",purpose:"any"},
                {src:icon,sizes:"any",purpose:"maskable"}
              ]
            };
            const nextUrl=URL.createObjectURL(
              new Blob([JSON.stringify(manifest)],{type:"application/manifest+json"})
            );
            manifestLink.href=nextUrl;
            if(manifestObjectUrl)URL.revokeObjectURL(manifestObjectUrl);
            manifestObjectUrl=nextUrl;
          }
        }catch(_){}

        return true;
      };

      window.RESTBR_APPLY_APP_ICON=applyAppIcon;

      try{
        const cached=typeof window.RESTBR_READ_BRAND_CACHE==="function"
          ? window.RESTBR_READ_BRAND_CACHE()
          : null;
        applyAppIcon(cached?.logo);
      }catch(_){}

      const scanBrandLogo=()=>{
        const logos=document.querySelectorAll(
          ".sm-logo,.sm-intro-logo,.pb-brand-logo,#pbBrand img"
        );
        for(const logo of logos){
          const source=logo?.currentSrc||logo?.getAttribute?.("src")||logo?.src||"";
          if(source&&applyAppIcon(source))return true;
        }
        return false;
      };

      const observer=new MutationObserver(scanBrandLogo);
      observer.observe(document.documentElement,{
        subtree:true,
        childList:true,
        attributes:true,
        attributeFilter:["src"]
      });

      if(document.readyState==="loading"){
        document.addEventListener("DOMContentLoaded",scanBrandLogo,{once:true});
      }else{
        scanBrandLogo();
      }

      window.addEventListener("pageshow",scanBrandLogo,{passive:true});
    })();
  </script>

  <script>
    (function(){
      try{
        const cached=typeof window.RESTBR_READ_BRAND_CACHE==="function"
          ? window.RESTBR_READ_BRAND_CACHE()
          : null;
        if(!cached)return;

        const cachedLogo=typeof window.RESTBR_SAFE_MEDIA_URL==="function"
          ? window.RESTBR_SAFE_MEDIA_URL(cached.logo)
          : "";
        const name=cached.nameAr||"پاشا بيبي";

        const brand=document.querySelector(".sm-intro-brand");
        if(brand)brand.textContent=name;

        document.querySelectorAll(".sm-intro-logo, .sm-logo").forEach(logo=>{
          if(logo && cachedLogo){
            logo.src=cachedLogo;
            logo.style.visibility="visible";
          }
        });
      }catch(_){}
    })();
  </script>
