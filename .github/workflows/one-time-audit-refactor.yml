name: One-time Pasha Audit Refactor

on:
  push:
    branches: [audit-hardening-2026-09-06]
    paths:
      - .github/workflows/one-time-audit-refactor.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: audit-hardening-2026-09-06
          fetch-depth: 1

      - name: Apply asserted refactor
        run: node scripts/apply-audit-refactor.mjs

      - name: Verify JavaScript and deployment integrity
        run: |
          node --check js/app.js
          node --check js/cart.js
          node --check js/supabase-config.js
          node scripts/predeploy-check.mjs

      - name: Remove one-time maintenance files
        run: |
          rm scripts/apply-audit-refactor.mjs
          rm .github/workflows/one-time-audit-refactor.yml

      - name: Commit refactor to audit branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: harden Pasha core flows after audit"
          git push origin HEAD:audit-hardening-2026-09-06

# retry: 2
