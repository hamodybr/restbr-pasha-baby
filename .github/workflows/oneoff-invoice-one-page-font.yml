name: One-off invoice one-page and custom-font patch

on:
  push:
    paths:
      - '.github/workflows/oneoff-invoice-one-page-font.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply invoice patch
        run: |
          python scripts/oneoff_invoice_patch.py
          python scripts/oneoff_invoice_patch_versions.py

      - name: Validate patched project
        run: |
          node --check js/admin-orders-customers.js
          node --check js/pasha-arabic-only.js
          node --check js/supabase-config.js
          node scripts/orders-labels-check.mjs
          node scripts/predeploy-check.mjs
          node scripts/retail-commerce-check.mjs
          node scripts/numeric-input-check.mjs
          node scripts/option-price-color-preview-check.mjs
          node scripts/performance-release-check.mjs

      - name: Commit patch and remove one-off helpers
        run: |
          git config user.name "HaMoDyBr"
          git config user.email "78080184+hamodybr@users.noreply.github.com"
          git rm .github/workflows/oneoff-invoice-one-page-font.yml scripts/oneoff_invoice_patch.py scripts/oneoff_invoice_patch_versions.py
          git add js/admin-orders-customers.js js/pasha-arabic-only.js js/supabase-config.js sw.js scripts/orders-labels-check.mjs scripts/live-smoke-test.mjs scripts/predeploy-check.mjs
          git commit -m "Fix invoice single-page print and uploaded font embedding"
          git push origin HEAD:${{ github.ref_name }}
