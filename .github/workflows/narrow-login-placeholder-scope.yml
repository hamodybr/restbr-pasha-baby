name: Narrow Pasha Placeholder Scope

on:
  push:
    branches:
      - fix/admin-login-no-flash

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-login-no-flash
          fetch-depth: 0
      - run: node scripts/narrow-pasha-placeholder-scope.mjs
      - name: Verify only branding keeps Pasha fallback
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PASHA_LOGIN_FIRST_PAINT_V1' admin.html
          grep -q 'id="rs_logo_preview".*pasha-baby-logo-256.webp' admin.html
          grep -q 'id="np_image_preview".*restaurant-placeholder.svg' admin.html
          git diff --check
      - name: Commit generated cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- admin.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git commit -m 'Limit Pasha logo fallback to admin branding'
          git push origin HEAD:fix/admin-login-no-flash
