name: One-time Admin Auth Callback Fix

on:
  push:
    branches: [audit-hardening-2026-09-06]
    paths:
      - .github/workflows/one-time-auth-callback-fix.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: audit-hardening-2026-09-06
          fetch-depth: 1

      - name: Defer Supabase role check outside auth callback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('admin.html')
          text = p.read_text()
          old = """        if(\n          event==='SIGNED_IN' ||\n          event==='TOKEN_REFRESHED' ||\n          event==='INITIAL_SESSION'\n        ){\n          unlockAdminForSession(session);\n        }"""
          new = """        if(\n          event==='SIGNED_IN' ||\n          event==='TOKEN_REFRESHED' ||\n          event==='INITIAL_SESSION'\n        ){\n          // Supabase recommends not starting async API work directly inside\n          // onAuthStateChange. Defer the role RPC to the next task.\n          setTimeout(()=>unlockAdminForSession(session),0);\n        }"""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one auth callback block, found {count}')
          p.write_text(text.replace(old, new))
          PY

      - name: Verify deployment integrity
        run: |
          node scripts/predeploy-check.mjs
          grep -Fq 'setTimeout(()=>unlockAdminForSession(session),0);' admin.html

      - name: Remove one-time workflow
        run: rm .github/workflows/one-time-auth-callback-fix.yml

      - name: Commit auth callback fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: defer admin role check outside auth callback"
          git push origin HEAD:audit-hardening-2026-09-06
