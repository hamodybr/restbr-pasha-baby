name: Validate and Deploy Pasha Baby Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Pre-deploy audit
        run: node scripts/predeploy-check.mjs

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: validate
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build WhatsApp social preview
        env:
          PASHA_LOGO_URL: https://wlollfpmjzenhkjwxrqo.supabase.co/storage/v1/object/public/menu-images/settings/logo/1788645406355-3ib1w5.png
        run: |
          python -m pip install --disable-pip-version-check --quiet pillow
          python <<'PY'
          import io
          import os
          import pathlib
          import urllib.request
          from PIL import Image, ImageOps

          source = os.environ['PASHA_LOGO_URL'] + '?og-build=20260906-5'
          request = urllib.request.Request(source, headers={'User-Agent': 'RestBr-Pasha-OG-Builder/1.0'})
          with urllib.request.urlopen(request, timeout=30) as response:
              raw = response.read()

          image = Image.open(io.BytesIO(raw)).convert('RGB')
          image = ImageOps.fit(image, (600, 600), method=Image.Resampling.LANCZOS)

          output = pathlib.Path('assets/pasha-social-preview.jpg')
          output.parent.mkdir(parents=True, exist_ok=True)

          for quality in (82, 76, 70, 64, 58):
              image.save(output, 'JPEG', quality=quality, optimize=True, progressive=True)
              size = output.stat().st_size
              if size <= 300 * 1024:
                  break
          else:
              raise SystemExit(f'Social preview is still too large: {size} bytes')

          print(f'Generated {output}: {size} bytes, 600x600')
          PY

          python <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          image_url = 'https://pashababy.restbr.com/assets/pasha-social-preview.jpg?v=20260906-5'

          html = re.sub(r'(<meta\s+property=["\']og:image["\']\s+content=["\'])[^"\']+(["\'])', rf'\g<1>{image_url}\2', html, flags=re.I)
          html = re.sub(r'(<meta\s+property=["\']og:image:secure_url["\']\s+content=["\'])[^"\']+(["\'])', rf'\g<1>{image_url}\2', html, flags=re.I)
          html = re.sub(r'(<meta\s+property=["\']og:image:type["\']\s+content=["\'])[^"\']+(["\'])', r'\g<1>image/jpeg\2', html, flags=re.I)
          html = re.sub(r'(<meta\s+name=["\']twitter:image["\']\s+content=["\'])[^"\']+(["\'])', rf'\g<1>{image_url}\2', html, flags=re.I)
          html = re.sub(r'(<meta\s+name=["\']twitter:card["\']\s+content=["\'])[^"\']+(["\'])', r'\g<1>summary\2', html, flags=re.I)

          if 'property="og:image:width"' not in html:
              marker = '<meta property="og:image:type" content="image/jpeg">'
              html = html.replace(marker, marker + '\n  <meta property="og:image:width" content="600">\n  <meta property="og:image:height" content="600">')

          path.write_text(html, encoding='utf-8')
          PY

          test -s assets/pasha-social-preview.jpg
          test "$(stat -c%s assets/pasha-social-preview.jpg)" -le 307200
          grep -Fq 'https://pashababy.restbr.com/assets/pasha-social-preview.jpg?v=20260906-5' index.html
          grep -Fq 'property="og:image:width" content="600"' index.html
          grep -Fq 'property="og:image:height" content="600"' index.html

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  live-smoke:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify deployed Pasha Baby site
        env:
          SMOKE_BASE_URL: https://pashababy.restbr.com
        run: node scripts/live-smoke-test.mjs
