name: Defer Pasha Baby admin i18n until login

on:
  push:
    paths:
      - '.github/workflows/defer-admin-i18n.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Defer heavy dashboard localization until auth unlock
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('js/supabase-config.js')
          s = p.read_text()

          old = """// Load the shared menu-language policy for both the public menu and admin.
          (() => {
            if (document.getElementById('restbrLanguageSettingsScript')) return;

            const script = document.createElement('script');
            script.id = 'restbrLanguageSettingsScript';
            script.src = 'js/language-settings.js?v=1.1';
            script.async = false;
            document.head.appendChild(script);
          })();"""

          new = """// Load the shared menu-language policy.
          // On admin pages, keep the login screen lightweight: dashboard localization
          // starts only after authentication unlocks the body. This avoids expensive
          // DOM observers/scans while the user is typing email/password on mobile Safari.
          (() => {
            const loadLanguageSettings = () => {
              if (document.getElementById('restbrLanguageSettingsScript')) return;
              const script = document.createElement('script');
              script.id = 'restbrLanguageSettingsScript';
              script.src = 'js/language-settings.js?v=1.2';
              script.async = false;
              document.head.appendChild(script);
            };

            if (!RESTBR_IS_ADMIN_PATH) {
              loadLanguageSettings();
              return;
            }

            const startAfterUnlock = () => {
              if (!document.body || document.body.classList.contains('auth-locked')) return false;
              loadLanguageSettings();
              return true;
            };

            const watchForUnlock = () => {
              if (startAfterUnlock()) return;
              const observer = new MutationObserver(() => {
                if (!startAfterUnlock()) return;
                observer.disconnect();
              });
              observer.observe(document.body, { attributes: true, attributeFilter: ['class'] });
            };

            if (document.readyState === 'loading') {
              document.addEventListener('DOMContentLoaded', watchForUnlock, { once: true });
            } else {
              watchForUnlock();
            }
          })();"""

          if old not in s:
            raise SystemExit('Expected language-settings loader block not found; refusing patch')

          p.write_text(s.replace(old, new, 1))
          PY

      - name: Verify
        run: |
          grep -q "starts only after authentication unlocks" js/supabase-config.js
          grep -q "language-settings.js?v=1.2" js/supabase-config.js
          git diff --check

      - name: Commit
        run: |
          git config user.name "HaMoDyBr"
          git config user.email "78080184+hamodybr@users.noreply.github.com"
          git add js/supabase-config.js
          git commit -m "fix: keep Pasha Baby admin login lightweight"
          git push origin HEAD:main
