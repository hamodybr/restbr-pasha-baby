name: One-off retail audit version sync

on:
  push:
    branches:
      - feat/adaptive-invoice-frame
    paths:
      - scripts/run-retail-audit-version-sync.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/adaptive-invoice-frame
          fetch-depth: 0
      - name: Sync audit version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/retail-commerce-check.mjs')
          text=p.read_text(encoding='utf-8')
          old='js/pasha-arabic-only.js?v=1.3'
          if text.count(old) != 2:
              raise SystemExit(f'expected 2 old audit markers, found {text.count(old)}')
          p.write_text(text.replace(old,'js/pasha-arabic-only.js?v=1.4'),encoding='utf-8')
          PY
      - name: Verify all core audits
        run: |
          node scripts/predeploy-check.mjs
          node scripts/retail-commerce-check.mjs
          node scripts/orders-labels-check.mjs
      - name: Commit
        run: |
          git config user.name 'HaMoDyBr'
          git config user.email '78080184+hamodybr@users.noreply.github.com'
          git add scripts/retail-commerce-check.mjs
          git commit -m 'Sync retail audit with Arabic policy cache version'
          git push origin HEAD:feat/adaptive-invoice-frame
