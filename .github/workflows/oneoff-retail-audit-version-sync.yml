name: One-off retail audit version sync

on:
  push:
    branches:
      - feat/adaptive-invoice-frame
    paths:
      - scripts/run-retail-audit-version-sync.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/adaptive-invoice-frame
          fetch-depth: 0
      - name: Sync audit versions
        run: |
          python - <<'PY'
          from pathlib import Path

          retail=Path('scripts/retail-commerce-check.mjs')
          text=retail.read_text(encoding='utf-8')
          old='js/pasha-arabic-only.js?v=1.3'
          if text.count(old) != 2:
              raise SystemExit(f'expected 2 old retail audit markers, found {text.count(old)}')
          retail.write_text(text.replace(old,'js/pasha-arabic-only.js?v=1.4'),encoding='utf-8')

          orders=Path('scripts/orders-labels-check.mjs')
          text=orders.read_text(encoding='utf-8')
          old_settings="admin-invoice-settings.js?v=1.0"
          old_orders="admin-orders-customers.js?v=1.7"
          if text.count(old_settings) != 1:
              raise SystemExit(f'expected 1 old invoice settings marker, found {text.count(old_settings)}')
          if text.count(old_orders) != 1:
              raise SystemExit(f'expected 1 old invoice orders marker, found {text.count(old_orders)}')
          text=text.replace(old_settings,'admin-invoice-settings.js?v=1.1')
          text=text.replace(old_orders,'admin-orders-customers.js?v=1.8')
          orders.write_text(text,encoding='utf-8')
          PY
      - name: Verify all core audits
        run: |
          node scripts/predeploy-check.mjs
          node scripts/retail-commerce-check.mjs
          node scripts/orders-labels-check.mjs
          node scripts/numeric-input-check.mjs
          node scripts/option-price-color-preview-check.mjs
          node scripts/performance-release-check.mjs
      - name: Commit
        run: |
          git config user.name 'HaMoDyBr'
          git config user.email '78080184+hamodybr@users.noreply.github.com'
          git add scripts/retail-commerce-check.mjs scripts/orders-labels-check.mjs
          git commit -m 'Sync invoice and retail audit cache versions'
          git push origin HEAD:feat/adaptive-invoice-frame
