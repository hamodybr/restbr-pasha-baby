name: Apply Invoice Margin Final Fix

on:
  push:
    branches:
      - fix/invoice-customer-spacing-settings-parity
    paths:
      - scripts/apply-invoice-margin-final.mjs
      - .github/workflows/apply-invoice-margin-final.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/invoice-customer-spacing-settings-parity
          fetch-depth: 0

      - name: Apply deterministic invoice margin fix
        run: node scripts/apply-invoice-margin-final.mjs

      - name: Validate JavaScript and invoice audit
        run: |
          node --check js/admin-invoice-pdf-onepage-v8.js
          node --check js/admin-invoice-print-ready-v9.js
          node --check js/admin-invoice-settings.js
          node scripts/invoice-pdf-onepage-check.mjs
          node scripts/orders-labels-check.mjs
          node scripts/predeploy-audit.mjs

      - name: Commit fix and remove helpers
        run: |
          rm -f scripts/apply-invoice-margin-final.mjs .github/workflows/apply-invoice-margin-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make invoice margin deterministic and lift customer address"
          git push origin HEAD:fix/invoice-customer-spacing-settings-parity
