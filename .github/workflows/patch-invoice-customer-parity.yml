name: Patch Invoice Customer Spacing and Settings Parity

on:
  push:
    branches:
      - fix/invoice-customer-spacing-settings-parity

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/invoice-customer-spacing-settings-parity
          fetch-depth: 0

      - name: Locate invoice settings loader
        shell: bash
        run: |
          grep -RniE 'admin-invoice-settings|invoice-settings' . --exclude='patch-invoice-customer-parity.mjs' --exclude-dir=.git || true

      - name: Apply safe invoice patch
        run: node scripts/patch-invoice-customer-parity.mjs

      - name: Validate invoice scripts
        shell: bash
        run: |
          set -euo pipefail
          node --check js/admin-invoice-pdf-onepage-v8.js
          node --check js/admin-invoice-settings.js
          node --check js/admin-invoice-print-ready-v9.js
          node --check js/runtime-config.js
          node scripts/invoice-pdf-onepage-check.mjs
          git diff --check
          grep -Fq "Math.max(5, num(cfg.address_size_pt, 9.5) * .45)" js/admin-invoice-pdf-onepage-v8.js
          grep -Fq "product: 'مجموع الأصناف'" js/admin-invoice-pdf-onepage-v8.js
          grep -Fq "['الخط العام', ['line_height']]" js/admin-invoice-settings.js
          ! grep -Fq '<option value="auto">تلقائي</option>' js/admin-invoice-settings.js

      - name: Commit generated invoice changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/admin-invoice-pdf-onepage-v8.js js/admin-invoice-settings.js js/admin-invoice-print-ready-v9.js js/runtime-config.js scripts/invoice-pdf-onepage-check.mjs
          git add admin.html js/*.js
          if git diff --cached --quiet; then
            echo 'No generated changes to commit'
            exit 0
          fi
          git commit -m 'Fix invoice customer spacing and settings parity'
          git push origin HEAD:fix/invoice-customer-spacing-settings-parity
