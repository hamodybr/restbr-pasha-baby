name: Patch Pasha Login First Paint

on:
  push:
    branches:
      - fix/admin-login-no-flash

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/admin-login-no-flash
          fetch-depth: 0

      - name: Apply first-paint patch
        run: node scripts/patch-pasha-login-first-paint.mjs

      - name: Verify patch scope
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PASHA_LOGIN_FIRST_PAINT_V1' admin.html
          grep -q 'assets/pasha-baby-logo-256.webp' admin.html
          grep -q 'باشا بيبي Admin' admin.html
          ! grep -q '<h1>Restaurant Admin</h1>' admin.html
          git diff --check

      - name: Commit generated admin HTML
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- admin.html; then
            echo 'admin.html already patched'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git commit -m 'Apply Pasha login theme before first paint'
          git push origin HEAD:fix/admin-login-no-flash
