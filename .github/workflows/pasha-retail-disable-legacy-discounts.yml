name: Pasha retail legacy discount cleanup

on:
  push:
    paths:
      - '.github/workflows/pasha-retail-disable-legacy-discounts.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Disable restaurant discount manager in retail mode
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('js/supabase-config.js')
          s=p.read_text()
          marker="if (document.getElementById('restbrAdminDiscountsScript')) return;"
          pos=s.find(marker)
          if pos < 0:
            raise SystemExit('discount module marker not found')
          before=s.rfind("if (!RESTBR_IS_ADMIN_PATH) return;",0,pos)
          if before < 0:
            if "if (!RESTBR_IS_ADMIN_PATH || RESTBR_RETAIL_MODE) return;" in s[max(0,pos-250):pos]:
              raise SystemExit(0)
            raise SystemExit('discount admin guard not found')
          s=s[:before]+s[before:].replace(
            "if (!RESTBR_IS_ADMIN_PATH) return;",
            "if (!RESTBR_IS_ADMIN_PATH || RESTBR_RETAIL_MODE) return;",
            1
          )
          s=s.replace(
            '// Admin-only simple percentage discount manager.',
            '// Admin-only restaurant-mode percentage discount manager.'
          )
          p.write_text(s)
          PY
          grep -q "RESTBR_RETAIL_MODE) return" js/supabase-config.js
          git diff --check
      - name: Commit
        run: |
          git config user.name "HaMoDyBr"
          git config user.email "78080184+hamodybr@users.noreply.github.com"
          git add js/supabase-config.js
          git commit -m "fix: stop legacy restaurant discount panel in Pasha retail mode"
          git push origin HEAD:main
