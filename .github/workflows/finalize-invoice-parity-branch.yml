name: Finalize Invoice Parity Branch

on:
  push:
    branches:
      - fix/invoice-customer-spacing-settings-parity

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/invoice-customer-spacing-settings-parity
          fetch-depth: 0

      - name: Sync invoice settings cache expectations
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/js\/admin-invoice-settings.js?v=1\.1/js\/admin-invoice-settings.js?v=1.2/g' scripts/live-smoke-test.mjs
          sed -i 's/js\/admin-invoice-settings.js?v=1\.1/js\/admin-invoice-settings.js?v=1.2/g' scripts/orders-labels-check.mjs
          grep -Fq 'js/admin-invoice-settings.js?v=1.2' js/pasha-arabic-only.js
          grep -Fq 'js/admin-invoice-settings.js?v=1.2' scripts/live-smoke-test.mjs
          grep -Fq 'js/admin-invoice-settings.js?v=1.2' scripts/orders-labels-check.mjs

      - name: Full branch validation
        shell: bash
        run: |
          set -euo pipefail
          node --check js/admin-invoice-pdf-onepage-v8.js
          node --check js/admin-invoice-settings.js
          node --check js/admin-invoice-print-ready-v9.js
          node --check js/runtime-config.js
          node scripts/predeploy-check.mjs
          node scripts/retail-commerce-check.mjs
          node scripts/orders-labels-check.mjs
          node scripts/invoice-pdf-onepage-check.mjs
          node scripts/numeric-input-check.mjs
          node scripts/option-price-color-preview-check.mjs
          node scripts/performance-release-check.mjs
          git diff --check

      - name: Remove one-time patch helpers and commit final branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/live-smoke-test.mjs scripts/orders-labels-check.mjs
          git rm -f .github/workflows/patch-invoice-customer-parity.yml scripts/patch-invoice-customer-parity.mjs .github/workflows/finalize-invoice-parity-branch.yml
          git commit -m 'Finalize safe invoice settings parity fix'
          git push origin HEAD:fix/invoice-customer-spacing-settings-parity
