name: One-time Pasha Store Terminology Cleanup

on:
  push:
    branches: [fix-store-terminology-2026-09-06]
    paths:
      - .github/workflows/one-time-store-terminology.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout terminology branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix-store-terminology-2026-09-06
          fetch-depth: 1

      - name: Replace restaurant wording in dashboard sources
        run: |
          python3 - <<'PY'
          from pathlib import Path

          targets = [Path('admin.html'), *sorted(Path('js').glob('admin*.js'))]

          phrase_replacements = {
              'Restaurant — Admin Dashboard': 'Store — Admin Dashboard',
              'Restaurant Settings': 'Store Settings',
              'Save Restaurant Settings': 'Save Store Settings',
              'Restaurant status': 'Store status',
              'Restaurant Open': 'Store Open',
              'restaurant pickup': 'store pickup',
              'Restaurant Name': 'Store Name',
              'Restaurant name': 'Store name',
              'restaurant name': 'store name',
              'Restaurant Opening Hours': 'Store Opening Hours',
              'Entire Restaurant': 'Entire Store',
              'Restaurant settings': 'Store settings',
              'restaurant settings': 'store settings',
              'The restaurant is currently closed.': 'The store is currently closed.',
              'ناڤێ چێشتخانێ': 'ناڤێ دوکانێ',
              'چێشتخانەکە': 'دوکانەکە',
          }

          changed = []
          for path in targets:
              text = path.read_text(encoding='utf-8')
              original = text

              # Pasha is retail: every Arabic dashboard occurrence must say shop/store, not restaurant.
              text = text.replace('المطعم', 'المحل').replace('مطعم', 'محل')

              # Keep Arabic/English/Kurdish retail terminology aligned without touching technical identifiers.
              for old, new in phrase_replacements.items():
                  text = text.replace(old, new)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print('Changed dashboard files:')
          for path in changed:
              print(' -', path)
          if not changed:
              raise SystemExit('No dashboard terminology changes were made')

          # Persist a regression guard in the normal pre-deploy audit.
          check = Path('scripts/predeploy-check.mjs')
          audit = check.read_text(encoding='utf-8')
          anchor = "forbidText('js/supabase-config.js', 'testSupabaseConnection();', 'development connection-test request');"
          guard = r'''

// Pasha is a retail store: restaurant wording must never return to dashboard copy.
const pashaDashboardTextFiles = [
  'admin.html',
  ...walk('js', file => /^js\/admin.*\.js$/.test(file))
];
for (const file of pashaDashboardTextFiles) {
  const text = read(file);
  if (text.includes('مطعم')) fail(`${file}: restaurant wording found in Pasha retail dashboard`);
}
for (const marker of [
  'Restaurant Settings',
  'Restaurant Open',
  'Restaurant Name',
  'Restaurant Opening Hours'
]) {
  for (const file of pashaDashboardTextFiles) {
    if (read(file).includes(marker)) fail(`${file}: legacy restaurant English wording found: ${marker}`);
  }
}
'''
          if 'pashaDashboardTextFiles' not in audit:
              if audit.count(anchor) != 1:
                  raise SystemExit('predeploy terminology guard anchor not found exactly once')
              audit = audit.replace(anchor, anchor + guard)
              check.write_text(audit, encoding='utf-8')
          PY

      - name: Verify no restaurant wording remains in dashboard copy
        run: |
          if grep -RIn --include='admin.html' --include='admin*.js' 'مطعم' admin.html js; then
            echo 'Arabic restaurant wording still exists in dashboard sources'
            exit 1
          fi
          if grep -RInE --include='admin.html' --include='admin*.js' 'Restaurant Settings|Restaurant Open|Restaurant Name|Restaurant Opening Hours' admin.html js; then
            echo 'English restaurant wording still exists in dashboard sources'
            exit 1
          fi
          node scripts/predeploy-check.mjs

      - name: Remove one-time workflow
        run: rm .github/workflows/one-time-store-terminology.yml

      - name: Commit terminology cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: use store terminology across Pasha dashboard"
          git push origin HEAD:fix-store-terminology-2026-09-06
