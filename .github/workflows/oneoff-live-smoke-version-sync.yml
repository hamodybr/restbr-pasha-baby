name: One-off live smoke version sync

on:
  push:
    branches:
      - fix/live-smoke-adaptive-invoice-versions
    paths:
      - scripts/run-live-smoke-version-sync.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-smoke-adaptive-invoice-versions
          fetch-depth: 0
      - name: Sync live smoke cache markers
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/live-smoke-test.mjs')
          text=p.read_text(encoding='utf-8')
          replacements={
            'js/admin-invoice-settings.js?v=1.0':'js/admin-invoice-settings.js?v=1.1',
            'js/admin-orders-customers.js?v=1.7':'js/admin-orders-customers.js?v=1.8',
            'restbr-pasha-baby-v37':'restbr-pasha-baby-v38',
            'js/pasha-arabic-only.js?v=1.3':'js/pasha-arabic-only.js?v=1.4',
          }
          for old,new in replacements.items():
            count=text.count(old)
            if count != 1:
              raise SystemExit(f'{old}: expected 1 match, found {count}')
            text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Verify live smoke script
        run: |
          node --check scripts/live-smoke-test.mjs
          grep -Fq 'js/admin-invoice-settings.js?v=1.1' scripts/live-smoke-test.mjs
          grep -Fq 'js/admin-orders-customers.js?v=1.8' scripts/live-smoke-test.mjs
          grep -Fq 'restbr-pasha-baby-v38' scripts/live-smoke-test.mjs
          grep -Fq 'js/pasha-arabic-only.js?v=1.4' scripts/live-smoke-test.mjs
      - name: Commit
        run: |
          git config user.name 'HaMoDyBr'
          git config user.email '78080184+hamodybr@users.noreply.github.com'
          git add scripts/live-smoke-test.mjs
          git commit -m 'Sync live smoke with adaptive invoice cache versions'
          git push origin HEAD:fix/live-smoke-adaptive-invoice-versions
