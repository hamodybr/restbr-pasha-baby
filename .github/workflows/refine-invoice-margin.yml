name: Refine Invoice Margin Preview

on:
  push:
    branches:
      - fix/invoice-customer-spacing-settings-parity

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/invoice-customer-spacing-settings-parity
          fetch-depth: 0

      - name: Apply focused margin refinement
        run: node scripts/refine-invoice-margin-fix.mjs

      - name: Validate focused invoice fix
        shell: bash
        run: |
          set -euo pipefail
          node --check js/admin-invoice-pdf-onepage-v8.js
          node --check js/admin-invoice-settings.js
          node --check js/admin-invoice-print-ready-v9.js
          node scripts/invoice-pdf-onepage-check.mjs
          node scripts/predeploy-check.mjs
          node scripts/orders-labels-check.mjs
          git diff --check
          grep -Fq "doc.addImage(jpeg, 'JPEG', metrics.margin, metrics.margin, metrics.contentWidth, metrics.contentHeight)" js/admin-invoice-pdf-onepage-v8.js
          grep -Fq "previewPageMarginPercent(cfg)" js/admin-invoice-print-ready-v9.js
          grep -Fq 'outline-offset:${previewMarginPx}px' js/admin-invoice-settings.js
          grep -Fq '<option value="auto">تلقائي</option>' js/admin-invoice-settings.js

      - name: Commit refined fix and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/admin-invoice-pdf-onepage-v8.js js/admin-invoice-settings.js js/admin-invoice-print-ready-v9.js scripts/invoice-pdf-onepage-check.mjs
          git rm scripts/refine-invoice-margin-fix.mjs .github/workflows/refine-invoice-margin.yml
          git commit -m 'Make invoice print margin visible and preserve Auto page size'
          git push origin HEAD:fix/invoice-customer-spacing-settings-parity