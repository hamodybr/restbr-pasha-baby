name: Clean Invoice PR73 Scope

on:
  push:
    branches:
      - fix/invoice-customer-spacing-settings-parity
    paths:
      - .github/workflows/clean-invoice-pr73.yml

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/invoice-customer-spacing-settings-parity
          fetch-depth: 0

      - name: Restore unrelated files from main
        run: |
          git checkout origin/main -- js/admin-invoice-settings.js js/pasha-arabic-only.js scripts/live-smoke-test.mjs scripts/orders-labels-check.mjs

      - name: Keep invoice audit focused
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'scripts/invoice-pdf-onepage-check.mjs';
          let s = fs.readFileSync(p, 'utf8');
          s = s.replace("need('js/admin-invoice-settings.js', 'outline-offset:${previewMarginPx}px', 'settings preview shows page margin');\n", '');
          s = s.replace("need('js/admin-invoice-settings.js', \"['الخط العام', ['line_height']]\", 'only effective global line-height control is exposed');\n", '');
          s = s.replace("need('js/pasha-arabic-only.js', 'js/admin-invoice-settings.js?v=1.2', 'invoice settings cache-busted loader');\n", '');
          fs.writeFileSync(p, s);
          NODE

      - name: Validate focused diff
        run: |
          node --check js/admin-invoice-pdf-onepage-v8.js
          node --check js/admin-invoice-print-ready-v9.js
          node scripts/invoice-pdf-onepage-check.mjs
          node scripts/orders-labels-check.mjs
          git diff --exit-code origin/main -- js/admin-invoice-settings.js js/pasha-arabic-only.js scripts/live-smoke-test.mjs scripts/orders-labels-check.mjs

      - name: Commit clean focused fix
        run: |
          rm -f .github/workflows/clean-invoice-pr73.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+hamodybr@users.noreply.github.com"
          git add -A
          git commit -m "Narrow invoice margin fix to final PDF path"
          git push origin HEAD:fix/invoice-customer-spacing-settings-parity
